name: Windows

# Based on telegramdesktop/tdesktop v7.2.9 .github/workflows/win.yml
# (AyuGram's prepare.py is identical to that version).
# Only x64, one generator; libraries are cached and partial progress
# is saved even when the job times out, so the first long build resumes.
# Runs on push (code changes only) and manually (Actions → Windows → Run
# workflow; needs this file on the default branch). Pushes build Debug,
# except to the "release" branch: `git push origin dev:release` builds
# Release in its own queue, so it does not cancel the Debug builds.

on:
  push:
    # Branches only: tags (made with releases) do not build anything.
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
      # Not part of the client build.
      - 'examples/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options: [Debug, Release]
        default: Debug
      release_version:
        description: 'A version for a draft release, e.g. 7.2.10 (on "release" only, builds Release); empty: just build'
        type: string
        default: ''

concurrency:
  group: win-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360

    # A push to "release" builds Release, other branches build Debug.
    # Release needs the release variants of the libraries too, so they are
    # cached apart ("libs-full"): the Debug cache stays as it is.
    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      BUILD_TYPE: ${{ (inputs.release_version && 'Release') || inputs.build_type || (github.ref == 'refs/heads/release' && 'Release') || 'Debug' }}
      LIBS: ${{ ((inputs.release_version && 'Release') || inputs.build_type || (github.ref == 'refs/heads/release' && 'Release') || 'Debug') == 'Release' && 'libs-full' || 'libs' }}
      LIBS_ARGS: ${{ ((inputs.release_version && 'Release') || inputs.build_type || (github.ref == 'refs/heads/release' && 'Release') || 'Debug') == 'Release' && 'silent' || 'skip-release silent' }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      # The repository must stay public: TBuild is a symlink to C:, and
      # actions/checkout scopes its credentials with includeIf.gitdir on the
      # symlinked path while git sees the real one, so the first fetch goes
      # without auth. Adding our own header instead collides with the one
      # checkout sets for submodules ("Duplicate header", HTTP 400).
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configure git for cherry-picks."
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # Pinned to a commit: third-party action in a repo with secrets.
      - uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-third-party-

      - name: Restore libraries cache.
        id: libs
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.os }}-x64-${{ env.LIBS }}-${{ env.CACHE_KEY }}
          # For Release the Debug-only cache is a start: stages without
          # release variants are not built again.
          restore-keys: |
            ${{ runner.os }}-x64-${{ env.LIBS }}-${{ env.CACHE_KEY }}-partial-
            ${{ runner.os }}-x64-libs-${{ env.CACHE_KEY }}
            ${{ runner.os }}-x64-${{ env.LIBS }}-

      # Takes 5+ minutes and is needed only to build the libraries: with
      # them from the cache 30 GB free is enough for the client.
      - name: Clean up preinstalled software.
        if: steps.libs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $before = (Get-PSDrive C).Free / 1GB
          Get-Service docker -ErrorAction SilentlyContinue | Stop-Service -ErrorAction SilentlyContinue
          wsl --shutdown 2> $null
          Remove-Item "C:\Android\android-sdk", "C:\Program Files\dotnet", "C:\Miniconda", "C:\msys64", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$env:LOCALAPPDATA\Docker", "C:\ProgramData\DockerDesktop", "C:\Program Files\PostgreSQL", "C:\PostgreSQL", "C:\Program Files\MongoDB", "C:\Program Files\MySQL" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\ghcup", "C:\cabal", "C:\Program Files\LLVM", "C:\vcpkg", "C:\tools\kotlinc", "C:\tools\php", "C:\tools\Apache24", "C:\tools\nginx-*", "C:\selenium", "C:\SeleniumWebDrivers", "C:\Program Files\R", "C:\Program Files (x86)\R", "C:\rtools*", "C:\Program Files\Google\Chrome*", "C:\Program Files (x86)\Google\Chrome*", "C:\Program Files\Mozilla Firefox*", "C:\ProgramData\Package Cache" -Recurse -Force -ErrorAction SilentlyContinue
          # The _Instances registry is how vswhere finds Visual Studio.
          Get-ChildItem "C:\ProgramData\Microsoft\VisualStudio\Packages" -Exclude _Instances -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item C:\hostedtoolcache\windows\Go*, C:\hostedtoolcache\windows\Ruby*, C:\hostedtoolcache\windows\PyPy*, C:\hostedtoolcache\windows\Java_*, C:\hostedtoolcache\windows\NuGet* -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host ('{0:N1} GB -> {1:N1} GB free' -f $before, ((Get-PSDrive C).Free / 1GB))
          exit 0

      - name: Annotate compiler errors.
        shell: bash
        run: echo "::add-matcher::$TBUILD/$REPO_NAME/.github/msvc-matcher.json"

      - name: Libraries.
        id: libraries
        timeout-minutes: 330
        # breakpad's dump_syms needs ATL, which the runner lacks, and only
        # makes symbols for crash reports, which are off in this build.
        # The wallet engine is Rust: no incremental cargo builds in CI.
        shell: pwsh
        run: |
          $env:SKIP_DUMPSYMS = '1'
          $env:CARGO_INCREMENTAL = '0'
          & cmd /d /c "$env:TBUILD\$env:REPO_NAME\Telegram\build\prepare\win.bat $env:LIBS_ARGS 2>&1" |
            Tee-Object -FilePath "$env:TBUILD\prepare.log"
          exit $LASTEXITCODE

      # The last lines of a failed libraries build, on the run page.
      - name: Show why the libraries failed.
        if: failure() && steps.libraries.outcome == 'failure'
        shell: pwsh
        run: |
          $lines = @(Get-Content "$env:TBUILD\prepare.log" -Tail 90 -ErrorAction SilentlyContinue)
          for ($i = 0; $i -lt $lines.Count; $i += 30) {
            $part = $lines[$i..([Math]::Min($i + 29, $lines.Count - 1))] -join "`n"
            $part = $part -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Host "::error title=Libraries, lines $($i + 1)-$([Math]::Min($i + 30, $lines.Count)) of the last $($lines.Count)::$part"
          }

      # If the first build did not finish (timeout/cancel), keep what was
      # built so the next run continues instead of starting over.
      - name: Save partial libraries cache.
        if: always() && (steps.libraries.outcome == 'failure' || steps.libraries.outcome == 'cancelled') && steps.libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.os }}-x64-${{ env.LIBS }}-${{ env.CACHE_KEY }}-partial-${{ github.run_id }}

      - name: Read configuration.
        shell: bash
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "Using API credentials from repository secrets."
            API="-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH"
          else
            echo "::warning::TDESKTOP_API_ID / TDESKTOP_API_HASH secrets are not set, building with test API."
            API="-D TDESKTOP_API_TEST=ON"
          fi
          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/src/wallet_engine/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save libraries cache.
        if: steps.libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.os }}-x64-${{ env.LIBS }}-${{ env.CACHE_KEY }}

      # Objects of an earlier build: only what changed since compiles again.
      - name: Restore build cache.
        id: out
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ${{ runner.os }}-x64-out-${{ env.BUILD_TYPE }}-${{ env.CACHE_KEY }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-x64-out-${{ env.BUILD_TYPE }}-${{ env.CACHE_KEY }}-

      # A fresh checkout makes every source newer than the cached objects.
      # All sources get an old time, then the files changed since the
      # cached build are touched: MSBuild rebuilds them and what includes
      # them. If anything is unclear the cache is dropped, a full build is
      # always correct.
      - name: Keep unchanged sources older than the cached build.
        if: steps.out.outputs.cache-matched-key != ''
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          OLD="$(cat out/built-from.txt 2>/dev/null || true)"
          if [ -z "$OLD" ] \
            || ! git fetch --depth=1 origin "$OLD" \
            || ! git diff --name-only "$OLD" HEAD > ../changed.txt; then
            echo "The cached build is of an unknown commit, building everything."
            rm -rf out
            exit 0
          fi
          find . -path ./out -prune -o -path ./.git -prune -o -type f -print0 \
            | xargs -0 touch -d '2000-01-01 00:00:00'
          echo "Changed since $OLD:"
          cat ../changed.txt
          while IFS= read -r path; do
            if [ -d "$path" ]; then
              find "$path" -type f -print0 | xargs -0 -r touch
            elif [ -f "$path" ]; then
              touch "$path"
            fi
          done < ../changed.txt

      # The updater of the client compares its commit and time with the
      # newest release (Telegram/SourceFiles/fuckgram/fuckgram_updater.cpp).
      # The header is written after the time fix above: only the updater is
      # compiled again. Builds without them do not update themselves.
      - name: Stamp the release build.
        if: env.BUILD_TYPE == 'Release' && github.ref == 'refs/heads/release'
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          printf '#pragma once\n\n// Written by CI.\n#define FUCKGRAM_COMMIT "%s"\n#define FUCKGRAM_COMMIT_TIME %s\n' \
            "$(git rev-parse HEAD)" "$(git log -1 --format=%ct HEAD)" \
            > Telegram/SourceFiles/fuckgram/fuckgram_build.h
          cat Telegram/SourceFiles/fuckgram/fuckgram_build.h

      # 16 GB of RAM is not enough for four Release compilers on the
      # biggest files ("C1060: compiler is out of heap space"): the page
      # file grows up to 32 GB when needed. Never fails the build.
      - name: Free space for the page file.
        continue-on-error: true
        shell: pwsh
        run: |
          Get-PSDrive C, D -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ('{0}: {1:N1} GB free' -f $_.Name, ($_.Free / 1GB)) }

      # Pinned to a commit: third-party action in a repo with secrets.
      - uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc
        name: Bigger page file.
        continue-on-error: true
        with:
          minimum-size: 8GB
          maximum-size: 32GB
          disk-root: 'D:'

      # A Release build that still runs out of memory goes on with two
      # compilers (_CL_ is added after the project's /MP): what compiled
      # already is not compiled again.
      - name: Build.
        id: build
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat x64 ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=%BUILD_TYPE% ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config %BUILD_TYPE% --parallel
          if errorlevel 1 if "%BUILD_TYPE%"=="Release" (
            echo Building again with two compiler processes.
            set _CL_=/MP2
            cmake --build ..\out --config %BUILD_TYPE% --parallel
          )

      # Also after a failed build: what compiled is not compiled again.
      - name: Mark the build.
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        shell: bash
        run: echo "$GITHUB_SHA" > "$TBUILD/$REPO_NAME/out/built-from.txt"

      - name: Save build cache.
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out
          key: ${{ runner.os }}-x64-out-${{ env.BUILD_TYPE }}-${{ env.CACHE_KEY }}-${{ github.sha }}

      - name: Collect artifact.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\%BUILD_TYPE%
          mkdir artifact
          move "%OUT%\*.exe" artifact\

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: fuckgram-win-x64-${{ env.BUILD_TYPE }}-${{ github.sha }}
          path: artifact\
          retention-days: 2

  # A full version: Actions → Windows → Run workflow on "release" with
  # "release_version" set. The build becomes a draft release with the zip
  # and the commits since the last release; the authors edit the notes and
  # publish it, and only then the clients update to it (docs/releasing.md).
  # Pushes never make drafts. A job of its own: only it may write.
  draft:
    name: Draft the release
    needs: windows
    if: github.ref == 'refs/heads/release' && inputs.release_version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        name: Download the build.
        with:
          name: fuckgram-win-x64-Release-${{ github.sha }}
          path: artifact

      - name: Draft.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Bad version: $VERSION"
            exit 1
          fi
          # A draft of this version made before goes; a published one stays.
          if DRAFT="$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$DRAFT" = "true" ]; then
              gh release delete "$VERSION" --yes
            else
              echo "$VERSION is published already."
              exit 1
            fi
          fi
          EXE="$(cd artifact && ls *.exe | grep -iv '^updater' | head -n 1)"
          test -n "$EXE"
          ZIP="fuckgram-v$VERSION-win-x64-portable.zip"
          (cd artifact && zip -9 -X "../$ZIP" "$EXE")

          PREVIOUS="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          {
            echo "Added:"
            echo
            if [ -n "$PREVIOUS" ] && git rev-parse -q --verify "refs/tags/$PREVIOUS" > /dev/null; then
              git log --no-merges --format='- %s' "$PREVIOUS..$GITHUB_SHA"
            else
              git log --no-merges --format='- %s' -n 30 "$GITHUB_SHA"
            fi
            echo
            echo "commits: https://github.com/$GITHUB_REPOSITORY/commits/$VERSION"
          } > notes.md
          cat notes.md

          gh release create "$VERSION" "$ZIP" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "fuckgram Desktop $VERSION" \
            --notes-file notes.md
          echo "Draft: https://github.com/$GITHUB_REPOSITORY/releases"
